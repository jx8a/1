<!DOCTYPE html>
<html lang="zh-CN">
<head>

body{

}
.container{
    max-width:600px;

    gap:12px;

}
.row-two{

    display:flex;
    align-items:center;
    justify-content:center;
}
a{
    font-size:17px;
    color:#2563eb;
    text-decoration:none;
}
a:active{
    color:#1d4ed8;
}
.title{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#111827;
}
.sub-title{
    text-align:center;
    font-size:14px;
    color:#6b7280;
    margin-bottom:16px;
    margin-top:4px;
}
</style>
